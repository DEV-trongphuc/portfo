<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/me.webp" />
    <title>Huỳnh Trọng Phúc (TURNIO) | Fullstack Developer - AI Automation</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Be Vietnam Pro', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              display: ['Be Vietnam Pro', 'Inter', 'sans-serif'],
              editorial: ['Playfair Display', 'Be Vietnam Pro', 'Georgia', 'serif'],
              mono: ['Fira Code', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            },
            colors: {
              inkica: {
                50: '#EFF6FF',
                100: '#DBEAFE',
                200: '#BFDBFE',
                400: '#38BDF8',
                500: '#0EA5E9',
                600: '#2563EB',
                700: '#1E40FF',
                800: '#1E3A8A',
              },
              gold: {
                400: '#38BDF8',
                500: '#1E40FF',
                600: '#1D4ED8',
                primary: '#1E40FF',
                bright: '#0EA5E9',
                deep: '#1E3A8A',
              },
            },
            animation: {
              'blink': 'blink 1s step-end infinite',
              'spin-slow': 'spin 24s linear infinite',
              'pulse-glow': 'pulse-glow 3.5s ease-in-out infinite',
            },
            keyframes: {
              blink: {
                'from, to': { opacity: 1 },
                '50%': { opacity: 0 },
              },
              'pulse-glow': {
                '0%, 100%': { opacity: 0.92, transform: 'scale(1)' },
                '50%': { opacity: 1, transform: 'scale(1.04)' },
              },
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --surface-canvas: #F8F9FA;
        --surface-card: #FFFFFF;
        --surface-muted: #F1F5F9;
        --text-primary: #0F172A;
        --text-secondary: #475569;
        --text-muted: #64748B;
        --inkica-primary: #1E40FF;
        --inkica-blue: #2563EB;
        --inkica-cyan: #0EA5E9;
        --inkica-tint: #EFF6FF;
        --border-subtle: #E2E8F0;
        --font-sans: 'Be Vietnam Pro', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-display: 'Be Vietnam Pro', 'Inter', sans-serif;
        --font-editorial: 'Playfair Display', 'Be Vietnam Pro', Georgia, serif;
      }

      * {
        box-sizing: border-box;
        font-variant-numeric: lining-nums tabular-nums;
        font-feature-settings: "lnum" 1, "tnum" 1;
      }

      html {
        scroll-behavior: smooth;
        background-color: var(--surface-canvas);
        color: var(--text-primary);
        overflow-x: clip;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--surface-canvas);
        color: var(--text-primary);
        font-family: var(--font-sans);
        line-height: 1.65;
        letter-spacing: 0.004em;
        overflow-x: clip;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      h1, h2, h3, h4, .font-display {
        font-family: var(--font-display);
        color: var(--text-primary);
        text-wrap: balance;
        line-height: 1.38;
        letter-spacing: 0.01em;
        overflow: visible;
      }

      .font-editorial {
        font-family: var(--font-editorial);
        font-style: italic;
        letter-spacing: 0.005em;
      }

      /* INKICA Signature Royal Sapphire -> Electric Cyan Gradient Typography */
      .text-gradient-inkica,
      .ql-grad-title,
      .ql-grad-gold {
        background: linear-gradient(125deg, #1E3A8A 0%, #1E40FF 42%, #0284C7 75%, #06B6D4 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: #1E40FF;
        padding-top: 0.05em;
        padding-bottom: 0.1em;
        overflow: visible;
      }

      .text-gradient-amber {
        background: linear-gradient(125deg, #B45309 0%, #D97706 42%, #F59E0B 78%, #EAB308 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: #D97706;
        padding-top: 0.05em;
        padding-bottom: 0.1em;
        overflow: visible;
      }

      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-marquee {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        width: max-content;
        animation: marquee 42s linear infinite;
      }
      .animate-marquee:hover {
        animation-play-state: paused;
      }

      .text-gradient-gold {
        background: linear-gradient(125deg, #1E3A8A 0%, #1E40FF 45%, #0284C7 78%, #0EA5E9 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .cursor-blink::after {
        content: '|';
        animation: blink 1s step-end infinite;
        color: #1E40FF;
        margin-left: 4px;
      }

      .glass-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.60) 0%, rgba(255, 255, 255, 0.38) 100%);
        backdrop-filter: blur(20px) saturate(165%);
        -webkit-backdrop-filter: blur(20px) saturate(165%);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 12px 32px -14px rgba(30, 64, 255, 0.08);
      }

      .inkica-glass-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.56) 0%, rgba(255, 255, 255, 0.34) 100%);
        backdrop-filter: blur(22px) saturate(165%);
        -webkit-backdrop-filter: blur(22px) saturate(165%);
        border: 1px solid rgba(255, 255, 255, 0.88);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.92),
          0 12px 32px -14px rgba(30, 64, 255, 0.10);
        transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
      }
      .inkica-glass-card:hover {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.74) 0%, rgba(255, 255, 255, 0.48) 100%);
        border-color: rgba(30, 64, 255, 0.35);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.96),
          0 18px 40px -14px rgba(30, 64, 255, 0.14);
      }

      .ql-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(239, 246, 255, 0.92);
        border: 1px solid #BFDBFE;
        color: #1E40AF;
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        box-shadow: 0 2px 10px rgba(30, 64, 255, 0.06);
      }

      .btn-inkica-primary,
      .ql-btn-gold {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: linear-gradient(135deg, #1E40FF 0%, #2563EB 58%, #0284C7 100%);
        color: #FFFFFF;
        border: 1px solid rgba(30, 64, 255, 0.2);
        border-radius: 14px;
        font-family: var(--font-sans);
        font-weight: 700;
        box-shadow: 0 10px 26px -6px rgba(30, 64, 255, 0.34);
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, filter 0.2s ease;
      }
      .btn-inkica-primary:hover,
      .ql-btn-gold:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px -6px rgba(30, 64, 255, 0.45);
        filter: brightness(1.06);
      }

      .ql-btn-outline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.94);
        color: #0F172A;
        border: 1px solid #CBD5E1;
        border-radius: 14px;
        font-family: var(--font-sans);
        font-weight: 700;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
        transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .ql-btn-outline:hover {
        background: #EFF6FF;
        border-color: #38BDF8;
        color: #1E40FF;
        transform: translateY(-1px);
      }

      .ql-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.58) 0%, rgba(255, 255, 255, 0.36) 100%);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 14px 36px -16px rgba(30, 64, 255, 0.09);
        transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
      }
      .ql-card:hover {
        border-color: rgba(37, 99, 235, 0.42);
        box-shadow: 0 22px 48px -16px rgba(30, 64, 255, 0.14);
      }

      .ql-studio-frame {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(226, 232, 240, 0.92);
        border-radius: 24px;
        box-shadow: 0 24px 60px -22px rgba(15, 23, 42, 0.10);
      }

      .ql-pill-tab {
        border-radius: 999px;
        border: 1px solid #E2E8F0;
        background: #FFFFFF;
        color: #475569;
        transition: all 0.2s ease;
      }
      .ql-pill-tab:hover {
        border-color: #38BDF8;
        color: #1E40FF;
        background: #EFF6FF;
      }
      .ql-pill-tab-active {
        background: linear-gradient(135deg, #1E40FF 0%, #2563EB 55%, #0284C7 100%) !important;
        color: #FFFFFF !important;
        border-color: transparent !important;
        box-shadow: 0 8px 20px -6px rgba(30, 64, 255, 0.36);
      }

      .perspective-2000 { perspective: 2000px; }
      .perspective-1000 { perspective: 1000px; }

      /* Clean Light Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F1F5F9;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #2563EB;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-[#F8F9FA] text-[#0F172A] antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
